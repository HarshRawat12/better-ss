name: Bug report
description: Report a reproducible problem in Better SS
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Better SS. Do not include private captures or security vulnerabilities here.
  - type: input
    id: version
    attributes:
      label: Better SS version or commit
      placeholder: 0.3.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include monitor layout, scaling, and logs when relevant. Remove private information.
